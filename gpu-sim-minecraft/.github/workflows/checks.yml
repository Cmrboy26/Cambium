name: Simulator And Mod Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-policy-mod:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: simulator/training/requirements.txt
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: cambiummod
      - name: Install CPU Training Dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r simulator/training/requirements.txt
      - name: Check Generated Contract Tables
        run: python -B scripts/generate-contract.py --check
      - name: Configure Native CPU Build
        run: cmake -S simulator -B simulator/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DMCSIM_ENABLE_CUDA=OFF
      - name: Build Native Targets
        run: cmake --build simulator/build --parallel 2
      - name: Native Regression And Contract Fixtures
        run: ctest --test-dir simulator/build --output-on-failure --no-tests=error
      - name: Training And Dashboard Regressions
        run: python -B -m unittest simulator.training.test_training simulator.training.test_controllers simulator.training.test_experiments simulator.training.test_research simulator.training.test_deployment simulator.training.test_dashboard simulator.training.test_analyze_metrics simulator.training.test_rosie -v
      - name: Mod Checks And Shared Contract Fixtures
        run: |
          chmod +x cambiummod/gradlew
          ./cambiummod/gradlew -p cambiummod check --console=plain --no-daemon
      - name: Java Python HTTP And Replay Bridge
        env:
          MCSIM_LIVE_JAVA_CHECK: '1'
        run: python -B -m unittest simulator.training.test_training.InferenceChecks.test_java_bridge -v
      - name: Package Mod
        run: ./cambiummod/gradlew -p cambiummod build --console=plain --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: cambium-mod
          path: cambiummod/build/libs/*.jar
          if-no-files-found: error