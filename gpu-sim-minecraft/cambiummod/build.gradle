plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def identityRoot = projectDir
def identityVersion = project.version.toString()
def identitySources = files(fileTree('src/main'), 'build.gradle', 'gradle.properties')
def identityOutput = layout.buildDirectory.file('generated/buildIdentity/cambium-build.properties')
def buildIdentity = tasks.register('buildIdentity') {
	inputs.files(identitySources)
	inputs.property('version', identityVersion)
	outputs.file(identityOutput)
	doLast {
		def digest = java.security.MessageDigest.getInstance('SHA-256')
		identitySources.files.sort { first, second -> first.path <=> second.path }.each { source ->
			digest.update(identityRoot.toPath().relativize(source.toPath()).toString().replace('\\', '/').getBytes('UTF-8'))
			digest.update(source.bytes)
		}
		def properties = new Properties()
		properties.setProperty('version', identityVersion)
		properties.setProperty('source_hash', digest.digest().encodeHex().toString())
		properties.setProperty('built_utc', java.time.Instant.now().toString())
		def output = identityOutput.get().asFile
		output.parentFile.mkdirs()
		output.withOutputStream { stream -> properties.store(stream, null) }
	}
}

processResources {
	from(buildIdentity)
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

def replayAnalysisChecks = tasks.register('replayAnalysisChecks', JavaExec) {
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.cambium.ReplayAnalysisChecks'
	systemProperty 'cambium.contractFixtures', file('../contracts/policy_fixtures.json').absolutePath
	if (project.hasProperty('livePolicyPort')) args project.property('livePolicyPort')
	if (project.hasProperty('replayFile')) args '--replay', project.property('replayFile')
}

tasks.named('check') {
	dependsOn replayAnalysisChecks
}

tasks.named('test') {
	failOnNoDiscoveredTests = false
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
